[project]
name = "scaling-crl"
version = "0.1.0"
description = "1000 Layer Networks for Self-Supervised RL: Scaling Depth Can Enable New Goal-Reaching Capabilities"
readme = "README.md"
# Nvidia Blackwell requires CUDA 12.4+, cuDNN 9.1+, compatible JAX and python
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.4",
    "jax[cuda12]>=0.4.35",     # Modern JAX version for Blackwell support with CUDA 12
    "flax>=0.8.0",             # Updated to match JAX version
    "tyro",
    "gymnasium",
    "wandb>=0.26.0",
    "wandb-osh",
    "brax>=0.12.1",
    "mediapy>=1.2.2",
    "scipy>=1.12.0",
    "mujoco-mjx>=3.5.0",
    "warp-lang"
]

[tool.uv]
# Standardizes the JAX installation via the official CUDA index
# For Blackwell, ensure JAX_PLATFORM=cuda is set in your environment
index-url = "https://pypi.org/simple"

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com/"

